<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pizzaria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <img src="7l523dwlw1c2kn4clwuh.webp" alt="Logo da Pizzaria" weidht="100px" height="140px">
        <h1>🍕 Monte sua Pizza</h1>
        <form action="backend.php" method="POST">
            <h3>1. Tamanho:</h3>
            <label><input type="radio" name="tamanho" value="Broto" checked> Broto (R$ 45)</label>
            <label><input type="radio" name="tamanho" value="Grande"> Grande (R$ 65)</label>

            <h3>2. Sabores (1 ou 2):</h3>
            <label><input type="checkbox" name="sabores[]" value="Calabresa"> Calabresa</label>
            <label><input type="checkbox" name="sabores[]" value="Mussarela"> Mussarela</label>
            <label><input type="checkbox" name="sabores[]" value="Bacon"> Bacon</label>
            <label><input type="checkbox" name="sabores[]" value="Portuguesa"> Portuguesa</label>
            <label><input type="checkbox" name="sabores[]" value="Peixe"> Peixe</label>

            <h3>3. Refrigerante:</h3>
            <select name="refri">
                <option value="Nenhum">Nenhum</option>
                <option value="Coca">Coca 2L (R$ 12)</option>
                <option value="Guarana">Guaraná 2L (R$ 10)</option>
                <option value="Fanta">Fanta(R$ 12)</option>
                <option value="Pepsi">Pepsi(R$ 10)</option>
            </select>

            <h3>4. Borda:</h3>
                <label><input type="radio" name="borda" value="Cheddar" checked> Cheddar (R$ 5)</label>
                <label><input type="radio" name="borda" value="Catupiry"> Catupiry (R$ 5)</label>
                <label><input type="radio" name="borda" value="Nenhum"> Nenhum</label>

            <h3>5. Desconto:</h3>
             <input type="text" name="cupom">
            <button type="submit">Calcular Total</button>
        </form>
    </div>
</body>
</html>
